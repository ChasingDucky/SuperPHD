<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大学排名查询系统 - University Rankings</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎓 大学排名查询系统</h1>
            <p class="subtitle">University Rankings Aggregator</p>
        </header>

        <div class="search-section">
            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="搜索大学名称 / Search university name..."
                    autocomplete="off"
                >
                <button id="searchBtn" onclick="searchUniversities()">🔍 搜索</button>
            </div>

            <div class="filter-section">
                <div class="filter-row">
                    <label for="countryFilter">
                        <strong>按国家筛选 / Filter by Country:</strong>
                    </label>
                    <select id="countryFilter" onchange="filterByCountry()">
                        <option value="">所有国家 / All Countries</option>
                    </select>

                    <button onclick="exportData()" class="export-btn">
                        📥 导出CSV / Export CSV
                    </button>

                    <button onclick="showCompareDialog()" class="compare-btn">
                        ⚖️ 对比大学 / Compare
                    </button>
                </div>
            </div>

            <div class="ranking-sources">
                <h3>选择排名来源 / Select Ranking Sources:</h3>
                <div class="checkboxes">
                    <label>
                        <input type="checkbox" id="qs" value="qs" checked>
                        <span>QS World University Rankings</span>
                    </label>
                    <label>
                        <input type="checkbox" id="the" value="the" checked>
                        <span>THE (Times Higher Education)</span>
                    </label>
                    <label>
                        <input type="checkbox" id="usnews" value="usnews" checked>
                        <span>US News Best Global Universities</span>
                    </label>
                    <label>
                        <input type="checkbox" id="arwu" value="arwu" checked>
                        <span>软科 (ARWU/Shanghai Ranking)</span>
                    </label>
                    <label>
                        <input type="checkbox" id="cs" value="cs" checked>
                        <span>CS Rankings</span>
                    </label>
                </div>
                <button id="calculateAvg" onclick="calculateAverageRanking()">
                    📊 计算平均排名 / Calculate Average
                </button>
                <button id="updateBtn" onclick="updateRankings()" class="update-btn">
                    🔄 更新数据 / Update Data
                </button>
            </div>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>加载中... / Loading...</p>
        </div>

        <!-- Compare Dialog -->
        <div id="compareDialog" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close" onclick="closeCompareDialog()">&times;</span>
                <h2>对比大学 / Compare Universities</h2>
                <p>输入2-5所大学名称进行对比：<br>Enter 2-5 university names to compare:</p>
                <div class="compare-inputs">
                    <input type="text" id="compare1" placeholder="大学1 / University 1">
                    <input type="text" id="compare2" placeholder="大学2 / University 2">
                    <input type="text" id="compare3" placeholder="大学3 / University 3 (optional)">
                    <input type="text" id="compare4" placeholder="大学4 / University 4 (optional)">
                    <input type="text" id="compare5" placeholder="大学5 / University 5 (optional)">
                </div>
                <button onclick="compareUniversities()" class="btn-primary">
                    开始对比 / Start Comparison
                </button>
            </div>
        </div>

        <div id="results" class="results">
            <!-- Results will be displayed here -->
        </div>

        <div id="stats" class="stats">
            <p>数据库中共有 <span id="totalUniversities">0</span> 所大学</p>
        </div>

        <footer>
            <p>数据来源 / Data sources: QS, THE, US News, ARWU (软科), CS Rankings</p>
            <p>仅供参考 / For reference only</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
